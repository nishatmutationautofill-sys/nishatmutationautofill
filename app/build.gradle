plugins { id 'com.android.application' }

android {
    namespace 'com.nishat.servernotify'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nishat.servernotify'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.13.1'
}
